# Validation for the infrastructure repository. It never deploys and never
# needs cloud credentials: every job reads files, renders the Kustomize
# overlays locally and inspects the result.
#
# This repository has no application code, so there is no unit test suite and
# no coverage to report. The equivalent of tests is:
#   validate -> kustomize build, kubeconform, terraform fmt/validate
#   policy   -> posture rules over the rendered manifests
#   consistency -> cross-references between base, ingress and secrets
#
# The Trivy jobs report, they do not enforce yet: set exit-code to '1' to make
# findings block the pull request.
#
# The local guard is the versioned pre-commit hook in .githooks: enable it with
# `git config core.hooksPath .githooks`.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: 1.16.4
  KUSTOMIZE_VERSION: 5.8.1
  KUBECONFORM_VERSION: 0.8.0
  CONFTEST_VERSION: 0.71.1

jobs:
  validate:
    name: Validate manifests and Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install kustomize and kubeconform
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kustomize
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform

      - name: Render, validate and check Terraform
        run: make validate

  lint:
    name: Lint scripts, YAML and Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install linters
        env:
          HADOLINT_VERSION: 2.15.1
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          pipx install yamllint
          curl -fsSL -o /tmp/hadolint "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          sudo install -m 0755 /tmp/hadolint /usr/local/bin/hadolint

      - name: Lint
        run: make lint

  policy:
    name: Policy checks on rendered manifests
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install kustomize and conftest
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kustomize
          curl -fsSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin conftest

      - name: Evaluate policies
        run: make policy

  consistency:
    name: Cross-resource consistency
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Check cross-references
        run: make consistency

  scan:
    name: IaC and secret scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Misconfiguration report for Terraform, Kubernetes and Dockerfile
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: '0'

      - name: Secret scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: '0'
          skip-dirs: .git
