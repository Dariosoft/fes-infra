apiVersion: v1
kind: ConfigMap
metadata: {name: otel-collector-config, namespace: observability}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: 0.0.0.0:4317}
          http: {endpoint: 0.0.0.0:4318}
    processors:
      memory_limiter: {check_interval: 1s, limit_mib: 384}
      batch: {timeout: 5s, send_batch_size: 512}
      resource:
        attributes:
          - {key: deployment.environment, value: hostinger, action: upsert}
          - {key: service.namespace, value: friendly-e-shop, action: upsert}
    exporters:
      otlp_http/grafana:
        endpoint: ${env:GRAFANA_CLOUD_OTLP_ENDPOINT}
        headers: {Authorization: "${env:GRAFANA_CLOUD_AUTHORIZATION}"}
    service:
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus: {host: 0.0.0.0, port: 8888}
      pipelines:
        traces: {receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [otlp_http/grafana]}
        metrics: {receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [otlp_http/grafana]}
        logs: {receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [otlp_http/grafana]}
