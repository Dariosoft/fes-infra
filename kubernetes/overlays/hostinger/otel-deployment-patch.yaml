apiVersion: apps/v1
kind: Deployment
metadata: {name: otel-collector, namespace: observability}
spec:
  template:
    spec:
      containers:
        - name: collector
          env:
            - {name: GRAFANA_CLOUD_OTLP_ENDPOINT, valueFrom: {secretKeyRef: {name: grafana-cloud-credentials, key: otlp-endpoint}}}
            - {name: GRAFANA_CLOUD_AUTHORIZATION, valueFrom: {secretKeyRef: {name: grafana-cloud-credentials, key: authorization}}}
