apiVersion: v1
kind: ConfigMap
metadata: {name: otel-collector-config, namespace: observability}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: 0.0.0.0:4317}
          http: {endpoint: 0.0.0.0:4318}
    processors:
      memory_limiter: {check_interval: 1s, limit_mib: 384}
      batch: {timeout: 5s, send_batch_size: 512}
      resource:
        attributes:
          - {key: deployment.environment, value: minikube, action: upsert}
          - {key: service.namespace, value: friendly-e-shop, action: upsert}
    exporters:
      otlp_grpc/tempo: {endpoint: tempo.observability.svc.cluster.local:4317, tls: {insecure: true}}
      otlp_http/loki: {endpoint: http://loki.observability.svc.cluster.local:3100/otlp}
      prometheus: {endpoint: 0.0.0.0:8889, namespace: friendly_eshop}
    service:
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus: {host: 0.0.0.0, port: 8888}
      pipelines:
        traces: {receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [otlp_grpc/tempo]}
        metrics: {receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [prometheus]}
        logs: {receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [otlp_http/loki]}
