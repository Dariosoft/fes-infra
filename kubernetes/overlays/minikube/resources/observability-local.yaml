apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus-config, namespace: observability}
data:
  prometheus.yml: |
    global: {scrape_interval: 15s, evaluation_interval: 15s}
    scrape_configs:
      - job_name: otel-collector
        static_configs: [{targets: [otel-collector.observability.svc.cluster.local:8888, otel-collector.observability.svc.cluster.local:8889]}]
      - job_name: java-services
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - catalog-api.apps.svc.cluster.local:8080
              - order-api.apps.svc.cluster.local:8080
              - payment-api.apps.svc.cluster.local:8080
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: observability}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: prometheus}}
  template:
    metadata: {labels: {app.kubernetes.io/name: prometheus}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, fsGroup: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: prometheus
          image: prom/prometheus:v3.14.0
          args: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=24h, --web.enable-lifecycle]
          ports: [{name: http, containerPort: 9090}]
          readinessProbe: {httpGet: {path: /-/ready, port: http}}
          livenessProbe: {httpGet: {path: /-/healthy, port: http}}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 500m, memory: 768Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: config, mountPath: /etc/prometheus, readOnly: true}, {name: data, mountPath: /prometheus}]
      volumes: [{name: config, configMap: {name: prometheus-config}}, {name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: observability}
spec: {selector: {app.kubernetes.io/name: prometheus}, ports: [{name: http, port: 9090, targetPort: http}]}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: loki-config, namespace: observability}
data:
  loki.yaml: |
    auth_enabled: false
    server: {http_listen_port: 3100}
    common:
      path_prefix: /var/loki
      replication_factor: 1
      ring: {kvstore: {store: inmemory}}
      storage: {filesystem: {chunks_directory: /var/loki/chunks, rules_directory: /var/loki/rules}}
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index: {prefix: index_, period: 24h}
    limits_config: {retention_period: 24h, allow_structured_metadata: true, volume_enabled: true}
    compactor: {working_directory: /var/loki/compactor, retention_enabled: true, delete_request_store: filesystem}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: loki, namespace: observability}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: loki}}
  template:
    metadata: {labels: {app.kubernetes.io/name: loki}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: loki
          image: grafana/loki:3.7.8
          args: [-config.file=/etc/loki/loki.yaml]
          ports: [{name: http, containerPort: 3100}]
          readinessProbe: {httpGet: {path: /ready, port: http}}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 400m, memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: config, mountPath: /etc/loki, readOnly: true}, {name: data, mountPath: /var/loki}]
      volumes: [{name: config, configMap: {name: loki-config}}, {name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: loki, namespace: observability}
spec: {selector: {app.kubernetes.io/name: loki}, ports: [{name: http, port: 3100, targetPort: http}]}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: tempo-config, namespace: observability}
data:
  tempo.yaml: |
    server: {http_listen_port: 3200}
    distributor:
      receivers:
        otlp:
          protocols:
            grpc: {endpoint: 0.0.0.0:4317}
            http: {endpoint: 0.0.0.0:4318}
    ingester: {trace_idle_period: 10s, max_block_duration: 5m}
    compactor: {compaction: {block_retention: 24h}}
    storage: {trace: {backend: local, wal: {path: /var/tempo/wal}, local: {path: /var/tempo/blocks}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: tempo, namespace: observability}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: tempo}}
  template:
    metadata: {labels: {app.kubernetes.io/name: tempo}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: tempo
          image: grafana/tempo:2.9.0
          args: [-config.file=/etc/tempo/tempo.yaml]
          ports: [{name: http, containerPort: 3200}, {name: otlp-grpc, containerPort: 4317}, {name: otlp-http, containerPort: 4318}]
          readinessProbe: {httpGet: {path: /ready, port: http}}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 400m, memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: config, mountPath: /etc/tempo, readOnly: true}, {name: data, mountPath: /var/tempo}]
      volumes: [{name: config, configMap: {name: tempo-config}}, {name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: tempo, namespace: observability}
spec:
  selector: {app.kubernetes.io/name: tempo}
  ports: [{name: http, port: 3200, targetPort: http}, {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}, {name: otlp-http, port: 4318, targetPort: otlp-http}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-provisioning, namespace: observability}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - {name: Prometheus, type: prometheus, uid: prometheus, url: http://prometheus:9090, access: proxy, isDefault: true}
      - {name: Loki, type: loki, uid: loki, url: http://loki:3100, access: proxy}
      - {name: Tempo, type: tempo, uid: tempo, url: http://tempo:3200, access: proxy, jsonData: {tracesToLogsV2: {datasourceUid: loki}, serviceMap: {datasourceUid: prometheus}}}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-dashboards, namespace: observability}
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: Friendly E-Shop
        folder: Friendly E-Shop
        type: file
        disableDeletion: true
        options: {path: /var/lib/grafana/dashboards}
  overview.json: |
    {
      "title": "Friendly E-Shop Overview",
      "uid": "friendly-e-shop-overview",
      "schemaVersion": 41,
      "refresh": "10s",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {"id": 1, "type": "timeseries", "title": "HTTP request rate", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "sum by (application) (rate(http_server_requests_seconds_count[5m]))", "legendFormat": "{{application}}"}]},
        {"id": 2, "type": "timeseries", "title": "JVM memory", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "sum by (application) (jvm_memory_used_bytes)", "legendFormat": "{{application}}"}]},
        {"id": 3, "type": "logs", "title": "Application logs", "gridPos": {"h": 10, "w": 24, "x": 0, "y": 8}, "datasource": {"type": "loki", "uid": "loki"}, "targets": [{"expr": "{service_namespace=\"friendly-e-shop\"}"}]}
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana, namespace: observability}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: grafana}}
  template:
    metadata: {labels: {app.kubernetes.io/name: grafana}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 472, runAsGroup: 0, fsGroup: 472, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: grafana
          image: grafana/grafana:13.2.2
          ports: [{name: http, containerPort: 3000}]
          env:
            - {name: GF_SECURITY_ADMIN_USER, value: admin}
            - {name: GF_SECURITY_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: observability-secrets, key: grafana-admin-password}}}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "false"}
          readinessProbe: {httpGet: {path: /api/health, port: http}}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 400m, memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources, readOnly: true}
            - {name: data, mountPath: /var/lib/grafana}
            - {name: dashboards, mountPath: /etc/grafana/provisioning/dashboards/provider.yaml, subPath: provider.yaml, readOnly: true}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards/overview.json, subPath: overview.json, readOnly: true}
      volumes: [{name: provisioning, configMap: {name: grafana-provisioning}}, {name: dashboards, configMap: {name: grafana-dashboards}}, {name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: grafana, namespace: observability}
spec: {selector: {app.kubernetes.io/name: grafana}, ports: [{name: http, port: 3000, targetPort: http}]}
