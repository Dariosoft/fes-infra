apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: observability-ingress, namespace: observability}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: apps}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability}}
      ports:
        - {protocol: TCP, port: 4317}  # OTLP gRPC
        - {protocol: TCP, port: 4318}  # OTLP HTTP
        - {protocol: TCP, port: 8888}  # Collector metrics
        - {protocol: TCP, port: 8889}  # Collector Prometheus
        - {protocol: TCP, port: 3000}  # Grafana
        - {protocol: TCP, port: 3100}  # Loki
        - {protocol: TCP, port: 3200}  # Tempo
        - {protocol: TCP, port: 9090}  # Prometheus
