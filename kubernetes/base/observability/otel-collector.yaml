apiVersion: v1
kind: ConfigMap
metadata: {name: otel-collector-config, namespace: observability}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: 0.0.0.0:4317}
          http: {endpoint: 0.0.0.0:4318}
    processors:
      memory_limiter: {check_interval: 1s, limit_mib: 384}
      batch: {timeout: 5s, send_batch_size: 512}
      resource:
        attributes:
          - {key: service.namespace, value: friendly-e-shop, action: upsert}
    exporters:
      debug: {verbosity: basic}
    service:
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus: {host: 0.0.0.0, port: 8888}
      pipelines:
        traces: {receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [debug]}
        metrics: {receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [debug]}
        logs: {receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [debug]}
---
apiVersion: v1
kind: Service
metadata: {name: otel-collector, namespace: observability, labels: {app.kubernetes.io/name: otel-collector}}
spec:
  selector: {app.kubernetes.io/name: otel-collector}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
    - {name: metrics, port: 8888, targetPort: metrics}
    - {name: prometheus, port: 8889, targetPort: prometheus}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: otel-collector, namespace: observability, labels: {app.kubernetes.io/name: otel-collector}}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: otel-collector}}
  template:
    metadata: {labels: {app.kubernetes.io/name: otel-collector, app.kubernetes.io/part-of: friendly-e-shop}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.161.0
          args: [--config=/etc/otelcol/config.yaml]
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: metrics, containerPort: 8888}
            - {name: prometheus, containerPort: 8889}
          startupProbe: {httpGet: {path: /metrics, port: metrics}, failureThreshold: 20, periodSeconds: 5}
          readinessProbe: {tcpSocket: {port: otlp-grpc}, periodSeconds: 10}
          livenessProbe: {tcpSocket: {port: otlp-grpc}, periodSeconds: 20}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          volumeMounts: [{name: config, mountPath: /etc/otelcol, readOnly: true}, {name: tmp, mountPath: /tmp}]
      volumes: [{name: config, configMap: {name: otel-collector-config}}, {name: tmp, emptyDir: {}}]
