apiVersion: apps/v1
kind: Deployment
metadata: {name: panel-web, namespace: apps, labels: {app.kubernetes.io/name: panel-web, app.kubernetes.io/part-of: friendly-e-shop}}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector: {matchLabels: {app.kubernetes.io/name: panel-web}}
  template:
    metadata: {labels: {app.kubernetes.io/name: panel-web, app.kubernetes.io/part-of: friendly-e-shop}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: panel-web
          image: friendly-e-shop/panel-web:dev
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          startupProbe: {httpGet: {path: /healthz, port: http}, failureThreshold: 15, periodSeconds: 3}
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 20}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 150m, memory: 128Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true, runAsUser: 101}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: cache, mountPath: /var/cache/nginx}
      volumes: [{name: tmp, emptyDir: {}}, {name: cache, emptyDir: {}}]
