apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  namespace: apps
  labels: {app.kubernetes.io/name: order-api, app.kubernetes.io/part-of: friendly-e-shop}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector: {matchLabels: {app.kubernetes.io/name: order-api}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: order-api, app.kubernetes.io/part-of: friendly-e-shop}
      annotations: {prometheus.io/scrape: "true", prometheus.io/path: /actuator/prometheus, prometheus.io/port: "8080"}
    spec:
      serviceAccountName: rabbitmq-topology-waiter
      automountServiceAccountToken: true
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-rabbitmq-topology-job
          image: registry.k8s.io/kubectl:v1.37.1
          imagePullPolicy: IfNotPresent
          command: [kubectl, wait, "--for=create", "--timeout=300s", -n, platform, job/rabbitmq-topology]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 10001}
        - name: wait-for-rabbitmq-topology
          image: registry.k8s.io/kubectl:v1.37.1
          imagePullPolicy: IfNotPresent
          command: [kubectl, wait, "--for=condition=complete", "--timeout=600s", -n, platform, job/rabbitmq-topology]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 10001}
        - name: wait-for-kafka-topology-job
          image: registry.k8s.io/kubectl:v1.37.1
          imagePullPolicy: IfNotPresent
          command: [kubectl, wait, "--for=create", "--timeout=300s", -n, platform, job/kafka-topology]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 10001}
        - name: wait-for-kafka-topology
          image: registry.k8s.io/kubectl:v1.37.1
          imagePullPolicy: IfNotPresent
          command: [kubectl, wait, "--for=condition=complete", "--timeout=600s", -n, platform, job/kafka-topology]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: order-api
          image: friendly-e-shop/order-api:dev
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: DATABASE_URL, value: jdbc:postgresql://postgresql.platform.svc.cluster.local:5432/orders}
            - {name: DATABASE_USERNAME, value: orders}
            - {name: DATABASE_PASSWORD, valueFrom: {secretKeyRef: {name: app-secrets, key: orders-db-password}}}
            - {name: RABBITMQ_HOST, value: rabbitmq.platform.svc.cluster.local}
            - {name: RABBITMQ_USERNAME, value: app}
            - {name: RABBITMQ_PASSWORD, valueFrom: {secretKeyRef: {name: app-secrets, key: rabbitmq-password}}}
            - {name: KAFKA_BOOTSTRAP_SERVERS, value: kafka.platform.svc.cluster.local:9092}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=base,service.namespace=friendly-e-shop"
          startupProbe: {httpGet: {path: /actuator/health/liveness, port: http}, failureThreshold: 30, periodSeconds: 5}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: http}, periodSeconds: 20}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true, runAsUser: 10001}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
