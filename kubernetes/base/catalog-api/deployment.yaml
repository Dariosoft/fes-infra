apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: apps
  labels: {app.kubernetes.io/name: catalog-api, app.kubernetes.io/part-of: friendly-e-shop}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector: {matchLabels: {app.kubernetes.io/name: catalog-api}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: catalog-api, app.kubernetes.io/part-of: friendly-e-shop}
      annotations: {prometheus.io/scrape: "true", prometheus.io/path: /actuator/prometheus, prometheus.io/port: "8080"}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      terminationGracePeriodSeconds: 30
      containers:
        - name: catalog-api
          image: friendly-e-shop/catalog-api:dev
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: DATABASE_URL, value: jdbc:postgresql://postgresql.platform.svc.cluster.local:5432/catalog}
            - {name: DATABASE_USERNAME, value: catalog}
            - {name: DATABASE_PASSWORD, valueFrom: {secretKeyRef: {name: app-secrets, key: catalog-db-password}}}
            - {name: RABBITMQ_HOST, value: rabbitmq.platform.svc.cluster.local}
            - {name: RABBITMQ_USERNAME, value: app}
            - {name: RABBITMQ_PASSWORD, valueFrom: {secretKeyRef: {name: app-secrets, key: rabbitmq-password}}}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=base,service.namespace=friendly-e-shop"
          startupProbe: {httpGet: {path: /actuator/health/liveness, port: http}, failureThreshold: 30, periodSeconds: 5}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: http}, periodSeconds: 20}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true, runAsUser: 10001}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
