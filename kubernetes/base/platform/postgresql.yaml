apiVersion: v1
kind: ConfigMap
metadata: {name: postgresql-init, namespace: platform}
data:
  01-create-databases.sh: |
    #!/bin/sh
    set -eu
    psql --set=ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
      --set=account_password="$ACCOUNT_DB_PASSWORD" \
      --set=catalog_password="$CATALOG_DB_PASSWORD" \
      --set=orders_password="$ORDERS_DB_PASSWORD" \
      --set=payments_password="$PAYMENTS_DB_PASSWORD" \
      --set=panel_password="$PANEL_DB_PASSWORD" <<'SQL'
    CREATE USER accounts PASSWORD :'account_password';
    CREATE USER catalog PASSWORD :'catalog_password';
    CREATE USER orders PASSWORD :'orders_password';
    CREATE USER payments PASSWORD :'payments_password';
    CREATE USER panel PASSWORD :'panel_password';
    CREATE DATABASE accounts OWNER accounts;
    CREATE DATABASE catalog OWNER catalog;
    CREATE DATABASE orders OWNER orders;
    CREATE DATABASE payments OWNER payments;
    CREATE DATABASE panel OWNER panel;
    SQL
---
apiVersion: v1
kind: Service
metadata: {name: postgresql, namespace: platform, labels: {app.kubernetes.io/name: postgresql}}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: postgresql}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgresql, namespace: platform, labels: {app.kubernetes.io/name: postgresql}}
spec:
  serviceName: postgresql
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: postgresql}}
  template:
    metadata: {labels: {app.kubernetes.io/name: postgresql, app.kubernetes.io/part-of: friendly-e-shop}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgresql
          image: postgres:18.4-alpine3.24
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: postgres}
            - {name: POSTGRES_USER, value: postgres}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: platform-secrets, key: postgres-admin-password}}}
            - {name: ACCOUNT_DB_PASSWORD, valueFrom: {secretKeyRef: {name: platform-secrets, key: account-db-password}}}
            - {name: CATALOG_DB_PASSWORD, valueFrom: {secretKeyRef: {name: platform-secrets, key: catalog-db-password}}}
            - {name: ORDERS_DB_PASSWORD, valueFrom: {secretKeyRef: {name: platform-secrets, key: orders-db-password}}}
            - {name: PAYMENTS_DB_PASSWORD, valueFrom: {secretKeyRef: {name: platform-secrets, key: payments-db-password}}}
            - {name: PANEL_DB_PASSWORD, valueFrom: {secretKeyRef: {name: platform-secrets, key: panel-db-password}}}
            - {name: PGDATA, value: /var/lib/postgresql/18/docker}
          startupProbe: {exec: {command: [pg_isready, -U, postgres]}, failureThreshold: 30, periodSeconds: 5}
          readinessProbe: {exec: {command: [pg_isready, -U, postgres]}, periodSeconds: 10}
          livenessProbe: {exec: {command: [pg_isready, -U, postgres]}, periodSeconds: 20}
          resources:
            requests: {cpu: 150m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - {name: init, configMap: {name: postgresql-init, defaultMode: 493}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 10Gi}}
