apiVersion: v1
kind: Service
metadata: {name: rabbitmq, namespace: platform, labels: {app.kubernetes.io/name: rabbitmq}}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: rabbitmq}
  ports:
    - {name: amqp, port: 5672, targetPort: amqp}
    - {name: management, port: 15672, targetPort: management}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: rabbitmq, namespace: platform, labels: {app.kubernetes.io/name: rabbitmq}}
spec:
  serviceName: rabbitmq
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: rabbitmq}}
  template:
    metadata: {labels: {app.kubernetes.io/name: rabbitmq, app.kubernetes.io/part-of: friendly-e-shop}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      terminationGracePeriodSeconds: 60
      containers:
        - name: rabbitmq
          image: rabbitmq:4.2.9-management-alpine
          ports: [{name: amqp, containerPort: 5672}, {name: management, containerPort: 15672}]
          env:
            - {name: RABBITMQ_DEFAULT_USER, value: app}
            - {name: RABBITMQ_DEFAULT_PASS, valueFrom: {secretKeyRef: {name: platform-secrets, key: rabbitmq-password}}}
            - {name: RABBITMQ_DEFAULT_VHOST, value: friendly}
          startupProbe: {exec: {command: [rabbitmq-diagnostics, -q, ping]}, failureThreshold: 30, periodSeconds: 5, timeoutSeconds: 10}
          readinessProbe: {exec: {command: [rabbitmq-diagnostics, -q, check_running]}, periodSeconds: 10, timeoutSeconds: 10}
          livenessProbe: {exec: {command: [rabbitmq-diagnostics, -q, ping]}, periodSeconds: 20, timeoutSeconds: 10}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 768Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: data, mountPath: /var/lib/rabbitmq}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 5Gi}}
