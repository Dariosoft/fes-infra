apiVersion: v1
kind: ConfigMap
metadata: {name: kafka-topology, namespace: platform}
data:
  topology.sh: |
    #!/bin/bash
    set -euo pipefail

    BROKER="kafka.platform.svc.cluster.local:9092"
    TOPIC="orders.events"

    echo "Waiting for Kafka at ${BROKER}..."
    for attempt in $(seq 1 60); do
      if /opt/kafka/bin/kafka-topics.sh --bootstrap-server "${BROKER}" --list >/dev/null 2>&1; then
        break
      fi
      if [ "${attempt}" -eq 60 ]; then
        echo "Kafka did not become ready in time" >&2
        exit 1
      fi
      sleep 2
    done

    /opt/kafka/bin/kafka-topics.sh --bootstrap-server "${BROKER}" \
      --create --if-not-exists \
      --topic "${TOPIC}" \
      --partitions 3 \
      --replication-factor 1

    /opt/kafka/bin/kafka-topics.sh --bootstrap-server "${BROKER}" \
      --alter --topic "${TOPIC}" \
      --add-config retention.ms=604800000,cleanup.policy=delete

    /opt/kafka/bin/kafka-topics.sh --bootstrap-server "${BROKER}" --describe --topic "${TOPIC}"
---
apiVersion: batch/v1
kind: Job
metadata: {name: kafka-topology, namespace: platform, labels: {app.kubernetes.io/name: kafka-topology}}
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata: {labels: {app.kubernetes.io/name: kafka-topology, app.kubernetes.io/part-of: friendly-e-shop}}
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: kafka-topology
          image: apache/kafka:4.1.0
          command: ["/bin/bash", "/opt/topology/topology.sh"]
          env:
            - {name: HOME, value: "/tmp"}
            - {name: KAFKA_HEAP_OPTS, value: "-Xms128m -Xmx256m"}
          readinessProbe: {exec: {command: ["true"]}, periodSeconds: 10}
          livenessProbe: {exec: {command: ["true"]}, periodSeconds: 20}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 250m, memory: 320Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: topology, mountPath: /opt/topology, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: topology, configMap: {name: kafka-topology, defaultMode: 493}}
        - {name: tmp, emptyDir: {}}
