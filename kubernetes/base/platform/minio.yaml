apiVersion: v1
kind: Service
metadata: {name: minio, namespace: platform, labels: {app.kubernetes.io/name: minio}}
spec:
  selector: {app.kubernetes.io/name: minio}
  ports:
    - {name: api, port: 9000, targetPort: api}
    - {name: console, port: 9001, targetPort: console}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: minio, namespace: platform, labels: {app.kubernetes.io/name: minio}}
spec:
  serviceName: minio
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: minio}}
  template:
    metadata: {labels: {app.kubernetes.io/name: minio, app.kubernetes.io/part-of: friendly-e-shop}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: minio
          image: friendly-e-shop/minio:RELEASE.2025-10-15T17-29-55Z
          imagePullPolicy: IfNotPresent
          args: [server, /data, --console-address, ":9001"]
          ports: [{name: api, containerPort: 9000}, {name: console, containerPort: 9001}]
          env:
            - {name: MINIO_ROOT_USER, valueFrom: {secretKeyRef: {name: platform-secrets, key: minio-root-user}}}
            - {name: MINIO_ROOT_PASSWORD, valueFrom: {secretKeyRef: {name: platform-secrets, key: minio-root-password}}}
          startupProbe: {httpGet: {path: /minio/health/live, port: api}, failureThreshold: 30, periodSeconds: 5}
          readinessProbe: {httpGet: {path: /minio/health/ready, port: api}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /minio/health/live, port: api}, periodSeconds: 20}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 768Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 10Gi}}
