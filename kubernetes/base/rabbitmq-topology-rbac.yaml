apiVersion: v1
kind: ServiceAccount
metadata:
  name: rabbitmq-topology-waiter
  namespace: apps
  labels:
    app.kubernetes.io/part-of: friendly-e-shop
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rabbitmq-topology-waiter
  namespace: platform
  labels:
    app.kubernetes.io/part-of: friendly-e-shop
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rabbitmq-topology-waiter
  namespace: platform
  labels:
    app.kubernetes.io/part-of: friendly-e-shop
subjects:
  - kind: ServiceAccount
    name: rabbitmq-topology-waiter
    namespace: apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rabbitmq-topology-waiter
